}
function renderModule(m, tab){
  var head=h('div',{class:'mod-head'},
    h('button',{class:'btn ghost', onclick:function(){ go('home'); }},'\u2039 Path'),
    h('div',{class:'mod-title'},
      h('span',{class:'sym sm', style:'--sc:'+m.color+(m.symText?';--st:'+m.symText:''),'aria-hidden':'true'}, m.sym),
      h('div',{}, h('span',{class:'st-stop'},'Stop '+m.n), h('h1',{}, m.title))),
    m.learn ? h('div',{class:'tabs', role:'tablist'},
      h('button',{class:'tab'+(tab==='learn'?' on':''), role:'tab','aria-selected':String(tab==='learn'), onclick:function(){ go(m.id,'learn'); }},'Learn'),
      h('button',{class:'tab'+(tab==='quiz'?' on':''), role:'tab','aria-selected':String(tab==='quiz'), onclick:function(){ go(m.id,'quiz'); }},'Quiz')) : null);
  var body=h('div');
  app.append(head, body);
  if (tab==='learn' && m.learn){
    m.learn(body);
    body.append(h('div',{class:'next-cta'}, h('span',{},'Ready to show what you know?'), h('button',{class:'btn go big', onclick:function(){ go(m.id,'quiz'); }},'Start the quiz')));
  } else runQuiz(body, m);
}
function route(keepScroll){
  var parts=location.hash.replace('#','').split('/'), m=null;
  MODULES.forEach(function(x){ if (x.id===parts[0]) m=x; });
  app.innerHTML='';
  if (!me() || parts[0]==='welcome') renderWelcome();
  else if (parts[0]==='progress') renderProgress();
  else if (!m) renderHome();
  else renderModule(m, (parts[1]==='quiz' || !m.learn) ? 'quiz' : 'learn');
  if (!keepScroll) window.scrollTo(0,0);
}
function when(t){
  var d=new Date(t), now=new Date(), day=86400000;
  var sameDay=d.toDateString()===now.toDateString(), yest=new Date(now.getTime()-day).toDateString()===d.toDateString();
  var time=d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
  return sameDay ? 'Today, '+time : yest ? 'Yesterday, '+time : d.toLocaleDateString([], {day:'numeric', month:'short'})+', '+time;
}
function renderWelcome(){
  var list=Object.keys(learners).map(function(k){ return learners[k]; }).sort(function(a,b){ return (b.updatedAt||0)-(a.updatedAt||0); });
  var inp=h('input',{type:'text', class:'ans name-in', maxlength:'30', autocomplete:'off', 'aria-label':'Your first name', placeholder:'First name'});
  function start(){
    var name=inp.value.replace(/\s+/g,' ').trim();
    if (!name){ toast('Type a name first.'); inp.focus(); return; }
    var match=list.filter(function(l){ return l.name.toLowerCase()===name.toLowerCase(); })[0];
    if (match){ selectLearner(match.id); return; }
    var s=newLearner(name); persist(s); selectLearner(s.id);
  }
  inp.addEventListener('keydown', function(e){ if (e.key==='Enter') start(); });
  var card=h('section',{class:'panel welcome'});
  if (list.length){
    card.append(h('h2',{},'Who is learning today?'),
      h('div',{class:'learners'}, list.map(function(l){
        return h('button',{class:'learner', onclick:function(){ selectLearner(l.id); }},
          h('span',{class:'l-name'}, l.name),
          h('span',{class:'l-meta'}, totalStars(l)+' of '+(MODULES.length*3)+' stars'+((l.attempts&&l.attempts.length) ? ' \u2022 last played '+when(l.attempts[l.attempts.length-1].at) : '')));
      })),
      h('h3',{class:'or'},'New here? Type your name to start.'));
  } else {
    card.append(h('h2',{},'What\u2019s your name?'), h('p',{class:'hint'},'Your stars and quiz scores will be saved under your name.'));
  }
  card.append(h('div',{class:'answer-row'}, inp, h('button',{class:'btn go', onclick:start},'Start')));
  app.append(h('section',{class:'hero'},
      h('h1',{},'Area & Perimeter Workshop'),
      h('p',{class:'lede'},'Count squares, walk around shapes, split L-shapes and solve stories. Then test yourself.')),
    card);
  if (!list.length) setTimeout(function(){ inp.focus(); }, 50);
}
function renderProgress(){
  var s=me(), mods={}; MODULES.forEach(function(m){ mods[m.id]=m; });
  var att=(s.attempts||[]), skills=s.skills||{}, right=0, wrong=0;
  Object.keys(skills).forEach(function(k){ right+=skills[k].r; wrong+=skills[k].w; });
  var acc = right+wrong ? Math.round(100*right/(right+wrong)) : null;
  var ranked=Object.keys(skills).filter(function(k){ return skills[k].r+skills[k].w>=2; }).map(function(k){ var t=skills[k]; return {k:k, pct:Math.round(100*t.r/(t.r+t.w)), n:t.r+t.w}; });
  var weak=ranked.filter(function(x){ return x.pct<70; }).sort(function(a,b){ return a.pct-b.pct; }).slice(0,6);
  var strong=ranked.filter(function(x){ return x.pct>=90; }).sort(function(a,b){ return b.n-a.n; }).slice(0,6);
  var lastBy={}; att.forEach(function(a){ lastBy[a.m]=a; });
  var table=h('table',{class:'ptable'},
    h('thead',{}, h('tr',{}, h('th',{},'Stop'), h('th',{},'Best'), h('th',{},'Played'), h('th',{},'Last score'))),
    h('tbody',{}, MODULES.map(function(m){
      var l=lastBy[m.id];
      return h('tr',{}, h('td',{}, m.n+'. '+m.title), h('td',{class:'stars', html:starsHTML(bestOf(m.id))}),
        h('td',{}, String((s.plays&&s.plays[m.id])||0)), h('td',{}, l ? l.score+' / '+l.total : '\u2013'));
    })));
  function skillList(items, empty){
    if (!items.length) return h('p',{class:'hint'}, empty);
    return h('ul',{class:'skills'}, items.map(function(x){ return h('li',{}, h('span',{}, SKILL[x.k]||x.k), h('b',{}, x.pct+'%'), h('span',{class:'muted'}, ' of '+x.n)); }));
  }
  var recent=att.slice(-10).reverse();
  var saveNote = cloud.db && cloud.writable ? 'Saved to this page\u2019s progress store, so it is there on any device where you open this page while signed in.' :
    'Saved in this browser on this device.';
  app.append(
    h('div',{class:'mod-head'},
      h('button',{class:'btn ghost', onclick:function(){ go('home'); }},'\u2039 Path'),
      h('div',{class:'mod-title'}, h('div',{}, h('span',{class:'st-stop'},'Progress'), h('h1',{}, s.name)))),
    h('div',{class:'stats'},
      h('div',{class:'stat panel'}, h('b',{}, totalStars(s)+' / '+(MODULES.length*3)), h('span',{},'stars earned')),
      h('div',{class:'stat panel'}, h('b',{}, String(att.length)), h('span',{},'quizzes played')),
      h('div',{class:'stat panel'}, h('b',{}, acc==null ? '\u2013' : acc+'%'), h('span',{},'questions right'))),
    h('section',{class:'panel'}, h('h2',{},'Stops'), h('div',{class:'scroll-x'}, table)),
    h('div',{class:'two-col'},
      h('section',{class:'panel'}, h('h2',{},'Needs more practice'), skillList(weak,'Nothing yet. After a few quizzes, question types with under 70% right show up here.')),
      h('section',{class:'panel'}, h('h2',{},'Going well'), skillList(strong,'After a few quizzes, question types with 90% or more right show up here.'))),
    h('section',{class:'panel'}, h('h2',{},'Recent quizzes'),
      recent.length ? h('ul',{class:'recent'}, recent.map(function(a){
        return h('li',{}, h('span',{class:'muted'}, when(a.at)), h('span',{}, (mods[a.m]||{title:a.m}).title), h('b',{}, a.score+' / '+a.total), h('span',{class:'stars', html:starsHTML(a.stars)}));
      })) : h('p',{class:'hint'},'No quizzes yet. Pick a stop on the path and try its quiz.')),
    h('div',{class:'step-actions'},
      h('button',{class:'btn', onclick:function(){ go('welcome'); }},'Switch learner'),
      h('button',{class:'btn ghost', onclick:function(){
        if (window.confirm('Remove '+s.name+' and all of their progress? This cannot be undone.')){ removeLearner(s.id); go('welcome'); }
      }},'Remove this learner')),
    h('p',{class:'hint', style:'margin-top:14px'}, saveNote + (sheetOn() ? ' Quiz results are also sent to your tutor.' + (outboxLoad().length ? ' ' + outboxLoad().length + ' waiting to send.' : '') : '')));
}
function go(view, tab){
  var t = (view==='home'||view==='welcome'||view==='progress') ? '#'+view : '#'+view+'/'+(tab||'learn');
  if (location.hash===t) route(); else location.hash=t;
}
window.addEventListener('hashchange', route);
document.getElementById('brand').addEventListener('click', function(){ go('home'); });
document.getElementById('who').addEventListener('click', function(){ go('progress'); });
window.__G = G; window.__MODULES = MODULES; window.__MS = MS; window.__AP_STORIES = AP_STORIES; window.__AP = {gridSVG:gridSVG, rectSVG:rectSVG, LSVG:LSVG};
lsLoad();
refreshChrome();
route();
initCloud();
flushOutbox();
})();
