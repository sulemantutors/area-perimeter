<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Area & Perimeter Workshop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F8FD; --grid:rgba(46,134,222,.08); --card:#FFFFFF; --ink:#172338; --muted:#56678A;
  --line:#D3DEEE; --soft:#ECF2FA; --edge:#172338; --shadow:#172338; --on-ink:#FFFFFF;
  --c0:#1FAE7A; --c1:#F2B705; --c2:#E14545; --c3:#2E86DE; --c4:#8B5CF6; --c5:#D6336C; --c6:#E8590C; --c7:#5B5BD6; --teal:#0F8B8D;
  --t0:#11825A; --t1:#946F00; --t2:#C22E2E; --t3:#1C68BA; --t4:#6A40DA; --t5:#AF1E55; --t6:#B8460A;
  --good:#0E7C55; --goodbg:#E0F5EB; --bad:#BD2D2D; --badbg:#FCE8E8;
  --cw:2.15rem;
  --fd:'Fredoka','Trebuchet MS','Segoe UI',system-ui,sans-serif;
  --fb:'Lexend','Trebuchet MS','Segoe UI',system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1524; --grid:rgba(120,160,220,.07); --card:#162036; --ink:#E7EEF9; --muted:#9EB0CD;
    --line:#2B3B58; --soft:#1C2842; --edge:#8FA3C6; --shadow:#04070D; --on-ink:#0E1524;
    --t0:#3DDC9C; --t1:#FFCB3D; --t2:#FF7D7D; --t3:#70B5FF; --t4:#B89CFF; --t5:#FF72A6; --t6:#FF9A5C;
    --good:#44DDA0; --goodbg:#10372A; --bad:#FF8C8C; --badbg:#3B1A20;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1524; --grid:rgba(120,160,220,.07); --card:#162036; --ink:#E7EEF9; --muted:#9EB0CD;
  --line:#2B3B58; --soft:#1C2842; --edge:#8FA3C6; --shadow:#04070D; --on-ink:#0E1524;
  --t0:#3DDC9C; --t1:#FFCB3D; --t2:#FF7D7D; --t3:#70B5FF; --t4:#B89CFF; --t5:#FF72A6; --t6:#FF9A5C;
  --good:#44DDA0; --goodbg:#10372A; --bad:#FF8C8C; --badbg:#3B1A20;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  margin:0; color:var(--ink); font-family:var(--fb); font-size:17px; line-height:1.55;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;
}
h1,h2,h3{font-family:var(--fd);font-weight:600;line-height:1.15;margin:0}
p{margin:0}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--c3);outline-offset:3px;border-radius:6px}
img,svg{max-width:100%}
.muted{color:var(--muted)}
.hidden{display:none!important}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--paper);border-bottom:2.5px solid var(--edge)}
.topbar-in{max-width:1060px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--ink);cursor:pointer;font:600 1.15rem var(--fd);padding:4px}
.brand .mark{display:grid;grid-template-columns:repeat(3,11px);gap:3px}
.brand .mark i{display:block;width:11px;height:22px;border-radius:3px}
.starcount{font:600 1rem var(--fd);background:var(--card);border:2px solid var(--edge);border-radius:999px;padding:4px 14px;white-space:nowrap}
.starcount b{color:var(--t1)}
.starcount.hidden{display:none}

.wrap{max-width:1060px;margin:0 auto;padding:22px 18px 70px}

/* ---------- area & perimeter ---------- */
.apsvg{display:block;max-width:100%;height:auto;color:var(--ink);font-family:var(--fb)}
.apstage{display:flex;justify-content:center;align-items:center;min-height:200px;background:var(--soft);border-radius:16px;padding:14px}
.btn.ap-a{background:var(--c0);color:#fff}
.btn.ap-p{background:var(--c6);color:#fff}
.aplist{display:flex;gap:14px;align-items:stretch;min-width:min-content}
.apcard{background:var(--soft);border:2.5px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;min-width:120px}
.apcard.tagged{border-color:var(--edge)}
.aptag{font:600 .82rem var(--fd);background:var(--ink);color:var(--paper);border-radius:999px;padding:2px 10px;margin-top:4px}

/* ---------- area site ---------- */
.apbig{display:flex;flex-direction:column;gap:2px;border-radius:16px;padding:16px 18px;border:2.5px solid var(--edge);color:#10202F}
.apbig b{font:700 1.5rem var(--fd)}
.apbig em{font-style:normal;font-weight:700;margin-top:4px}
.ap-area{background:color-mix(in srgb,var(--c0) 55%,#fff)}
.ap-perim{background:color-mix(in srgb,var(--c6) 45%,#fff)}
.sortgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin:10px 0}
.sortcard{display:flex;flex-direction:column;gap:10px;padding:14px;border:2.5px solid var(--line);border-radius:16px;background:var(--soft)}
.sortcard b{font:600 1.05rem var(--fd)}
.sortcard.is-area{border-color:var(--c0);background:color-mix(in srgb,var(--c0) 18%,var(--card))}
.sortcard.is-perim{border-color:var(--c6);background:color-mix(in srgb,var(--c6) 16%,var(--card))}
.sortfb{font-size:.95rem;color:var(--muted);min-height:1.3em}
.btn.small{padding:6px 14px;font-size:.95rem}
.btn.wrong{border-color:var(--bad);background:var(--badbg)}
.padwrap{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:10px}
.padbox{background:var(--soft);border-radius:16px;padding:10px;display:inline-block}
.apsvg.pad rect{cursor:pointer}
.padread{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font:600 1.1rem var(--fd);min-height:2.4em;align-items:center}
.padread .pa,.padread .pp{border-radius:999px;padding:6px 16px;color:#10202F}
.padread .pa{background:color-mix(in srgb,var(--c0) 45%,#fff)}
.padread .pp{background:color-mix(in srgb,var(--c6) 40%,#fff)}

/* ---------- multi-step ---------- */
.method{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:12px}
@media (max-width:640px){.method{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mstep{border:2.5px solid var(--edge);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;background:var(--soft)}
.mstep b{font:600 1.05rem var(--fd)}
.mstep span{font-size:.88rem;color:var(--muted)}
.trail{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}
.tnode{min-width:96px;border:2.5px dashed var(--line);border-radius:14px;padding:8px 12px;display:flex;flex-direction:column;align-items:center;background:var(--card);transition:background .3s ease,border-color .3s ease}
.tnode b{font:700 1.6rem var(--fd);line-height:1.1;font-variant-numeric:tabular-nums}
.tnode span{font-size:.78rem;color:var(--muted);text-align:center}
.tnode.now{border-color:var(--c1);border-style:solid}
.tnode.done{border-style:solid;border-color:var(--edge);background:color-mix(in srgb,var(--c0) 22%,var(--card));animation:pop .3s ease}
.tnode.done.last{background:color-mix(in srgb,var(--c1) 40%,var(--card))}
.tarrow{font:700 1.4rem var(--fd);color:var(--muted)}
.plan{margin:0 0 12px;padding-left:1.4em;display:grid;gap:6px}
.plan li{background:var(--soft);border-radius:10px;padding:7px 12px}
.plan li span{color:var(--muted);margin-right:10px}
.plan li b{font-weight:600}
.ask{font-weight:600;font-size:1.08rem;margin:10px 0}
.mwork .choice{text-align:left;justify-content:flex-start;font-size:1.02rem}

/* ---------- learners & progress ---------- */
.top-right{display:flex;align-items:center;gap:10px}
.who{font:600 1rem var(--fd);color:var(--paper);background:var(--ink);border:2px solid var(--edge);border-radius:999px;padding:5px 14px;cursor:pointer;max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-height:38px}
.welcome{max-width:620px;margin:0 auto 24px}
.welcome h2{margin-bottom:12px}
.learners{display:grid;gap:10px;margin-bottom:18px}
.learner{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:12px 16px;background:var(--card);color:var(--ink);border:2.5px solid var(--edge);border-radius:14px;box-shadow:3px 3px 0 var(--shadow);cursor:pointer;font:inherit}
.learner:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--shadow)}
.l-name{font:600 1.25rem var(--fd)}
.l-meta{font-size:.88rem;color:var(--muted)}
.or{font-size:1.05rem;margin-bottom:10px}
.name-in{width:14ch}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:24px}
.stat{margin:0;display:flex;flex-direction:column;align-items:flex-start;padding:16px 18px}
.stat b{font:700 2rem var(--fd)}
.stat span{color:var(--muted);font-size:.92rem}
@media (max-width:560px){.stats{grid-template-columns:1fr}}
.ptable{width:100%;border-collapse:collapse;min-width:420px}
.ptable th,.ptable td{text-align:left;padding:9px 10px;border-bottom:1.5px solid var(--line)}
.ptable th{font:600 .9rem var(--fd);color:var(--muted)}
.skills,.recent{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.skills li{display:flex;gap:10px;align-items:baseline;padding:8px 12px;background:var(--soft);border-radius:10px}
.skills li span:first-child{flex:1}
.recent li{display:grid;grid-template-columns:minmax(120px,auto) 1fr auto auto;gap:12px;align-items:baseline;padding:8px 12px;background:var(--soft);border-radius:10px}
@media (max-width:560px){.recent li{grid-template-columns:1fr auto}}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font:600 1.02rem var(--fd);color:var(--ink);background:var(--card);
  border:2.5px solid var(--edge);border-radius:12px;padding:9px 18px;cursor:pointer;
  box-shadow:3px 3px 0 var(--shadow);transition:transform .08s ease,box-shadow .08s ease;
  min-height:46px;
}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--shadow)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:3px 3px 0 var(--shadow)}
.btn.go{background:var(--c3);color:#fff}
.btn.big{font-size:1.2rem;padding:12px 26px}
.btn.ghost{box-shadow:none;border-color:var(--line)}
.btn.ghost:hover{border-color:var(--edge)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{font:600 .95rem var(--fd);color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:999px;padding:7px 15px;cursor:pointer;min-height:40px}
.chip:hover{border-color:var(--edge)}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.round{width:44px;height:44px;border-radius:50%;border:2.5px solid var(--edge);background:var(--card);color:var(--ink);font:700 1.4rem var(--fd);cursor:pointer;box-shadow:2px 2px 0 var(--shadow);line-height:1;display:grid;place-items:center}
.round:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--shadow)}

/* ---------- panels ---------- */
.panel{background:var(--card);border:2.5px solid var(--edge);border-radius:20px;box-shadow:5px 5px 0 var(--shadow);padding:22px;margin-bottom:24px}
.panel h2{font-size:1.45rem;margin-bottom:6px}
.hint{color:var(--muted);max-width:68ch;margin-bottom:6px}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px}

/* ---------- home ---------- */
.hero{text-align:center;padding:10px 0 8px}
.hero h1{font-size:clamp(2.1rem,6vw,3.4rem);font-weight:700;letter-spacing:-.01em}
.lede{color:var(--muted);max-width:52ch;margin:10px auto 22px;font-size:1.05rem}
.odo-card{display:inline-block;max-width:100%;padding:22px 20px 18px}
.odo{display:flex;justify-content:center;align-items:flex-start;gap:8px}
.wheel{display:flex;flex-direction:column;align-items:center;gap:6px;width:clamp(44px,12vw,78px)}
.face{width:100%;height:clamp(62px,15vw,96px);border-radius:14px;background:var(--wc);color:#fff;font:700 clamp(2.1rem,8vw,3.6rem) var(--fd);display:grid;place-items:center;border:2.5px solid var(--edge);box-shadow:3px 3px 0 var(--shadow)}
.face.dark{color:#3A2A00}
.spin{width:100%;min-height:34px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font-size:.8rem;cursor:pointer}
.spin:hover{border-color:var(--edge)}
.wheel small{font-size:.7rem;color:var(--muted);text-align:center;line-height:1.15;min-height:2.3em}
.comma{font:700 clamp(2rem,7vw,3.2rem) var(--fd);align-self:center;margin-top:-30px}
.odo-say{margin-top:12px;font-size:1.05rem}
.odo-say i{color:var(--muted)}
.path{margin-top:34px}
.path-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.path-head h2{font-size:1.7rem}
.stations{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:18px}
.station{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;text-align:left;padding:16px;background:var(--card);color:var(--ink);border:2.5px solid var(--edge);border-radius:18px;box-shadow:4px 4px 0 var(--shadow);cursor:pointer;font:inherit}
.station:hover{transform:translate(-1px,-1px);box-shadow:6px 6px 0 var(--shadow)}
.station:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--shadow)}
.sym{width:64px;height:64px;border-radius:16px;background:var(--sc);color:var(--st,#fff);display:grid;place-items:center;font:700 1.7rem var(--fd);border:2.5px solid var(--edge)}
.sym.sm{width:52px;height:52px;font-size:1.4rem;border-radius:14px}
.st-body{display:flex;flex-direction:column;gap:1px}
.st-stop{font-size:.8rem;color:var(--muted)}
.st-title{font:600 1.18rem var(--fd)}
.st-desc{font-size:.9rem;color:var(--muted);line-height:1.35}
.stars{font-size:1.15rem;letter-spacing:2px;margin-top:3px}
.stars .on{color:var(--t1)}
.stars .off{color:var(--line)}

/* ---------- module header ---------- */
.mod-head{display:flex;align-items:center;flex-wrap:wrap;gap:14px 20px;margin-bottom:22px}
.mod-title{display:flex;align-items:center;gap:12px;flex:1 1 260px}
.mod-title h1{font-size:clamp(1.6rem,4.5vw,2.2rem)}
.tabs{display:inline-flex;background:var(--card);border:2.5px solid var(--edge);border-radius:14px;padding:4px;gap:4px}
.tab{font:600 1.05rem var(--fd);border:0;background:none;color:var(--ink);padding:8px 22px;border-radius:10px;cursor:pointer;min-height:42px}
.tab.on{background:var(--ink);color:var(--paper)}
.next-cta{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;padding:8px 0 10px;font:600 1.15rem var(--fd)}

/* ---------- place value ---------- */
.readout{text-align:center;font:700 clamp(2.6rem,9vw,4.4rem) var(--fd);letter-spacing:.02em;margin:10px 0 14px;font-variant-numeric:tabular-nums}
.readout .cm{color:var(--muted)}
.pv-chart{display:grid;grid-template-columns:repeat(6,minmax(122px,1fr));gap:10px;min-width:780px}
.pv-col{border:2.5px solid var(--pc);border-radius:16px;background:var(--card);display:flex;flex-direction:column;overflow:hidden}
.pv-col.bump{animation:bump .6s ease}
@keyframes bump{0%,100%{transform:none}35%{transform:translateY(-7px) scale(1.03)}}
.pv-head{background:var(--pc);color:#fff;text-align:center;padding:7px 4px;line-height:1.2}
.pv-head b{display:block;font:600 .95rem var(--fd)}
.pv-head span{font-size:.72rem;opacity:.92}
.pv-col[data-p="1"] .pv-head{color:#3A2A00}
.discs{min-height:176px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-content:flex-start;padding:12px 8px}
.disc{width:42px;height:42px;border-radius:50%;background:var(--pc);color:#fff;display:grid;place-items:center;font:600 .74rem var(--fb);box-shadow:inset 0 -3px 0 rgba(0,0,0,.2);animation:pop .22s ease}
.disc.small{font-size:.62rem}
.disc.tiny{font-size:.52rem;letter-spacing:-.02em}
.pv-col[data-p="1"] .disc,.disc.gold{color:#3A2A00}
.disc.big{width:56px;height:56px;font-size:.85rem;flex:none}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.pv-ctrl{display:flex;justify-content:center;align-items:center;gap:10px;padding:10px;border-top:2px solid var(--soft)}
.pv-count{font:700 1.5rem var(--fd);min-width:1.2em;text-align:center}
.forms{margin-top:16px;display:grid;gap:8px}
.form-row{display:grid;grid-template-columns:150px 1fr;gap:12px;padding:10px 14px;background:var(--soft);border-radius:12px;align-items:baseline}
.form-row span{color:var(--muted);font-size:.92rem}
.form-row b{font-weight:600}
@media (max-width:560px){.form-row{grid-template-columns:1fr;gap:2px}}
.inline-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:10px 0}
.nl svg{display:block;width:100%;max-width:640px;margin:8px auto;color:var(--ink)}
.explain{background:var(--soft);border-radius:14px;padding:12px 16px;max-width:72ch}

/* ---------- inputs ---------- */
.ans{font:600 1.45rem var(--fb);width:9ch;padding:8px 12px;border:2.5px solid var(--edge);border-radius:12px;background:var(--card);color:var(--ink);font-variant-numeric:tabular-nums}
.ans.sm{width:8ch;font-size:1.15rem;padding:6px 10px}
.ans.right{border-color:var(--good);background:var(--goodbg)}
.ans.wrong{border-color:var(--bad);background:var(--badbg)}
.own{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:4px 0 16px;color:var(--muted)}
.own .op{font:700 1.3rem var(--fd);color:var(--ink)}

/* ---------- column lab (add / sub / mul) ---------- */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:18px;align-items:start}
@media (max-width:780px){.split{grid-template-columns:1fr}}
.vcard{background:var(--soft);border-radius:16px;padding:18px 14px;display:flex;justify-content:center}
.vgrid{display:inline-grid;font:600 clamp(1.45rem,4.6vw,2.05rem) var(--fb);font-variant-numeric:tabular-nums}
.vc{width:var(--cw);height:1.55em;display:grid;place-items:center;border-radius:8px;position:relative}
.vc.on{background:color-mix(in srgb,var(--c1) 30%,transparent)}
.vc.lbl{font-size:.42em;height:1.4em;color:var(--pc,var(--muted));font-weight:700}
.vc.carry{font-size:.55em;height:1.25em;color:var(--pcx,var(--c2));font-weight:700}
.vc.opc{font-weight:700}
.vc.res{color:var(--t3)}
.vc.struck::after{content:"";position:absolute;left:18%;right:18%;top:50%;border-top:3px solid var(--c2);transform:rotate(-20deg)}
.vc.struck{color:var(--muted)}
.vline{border-top:3.5px solid var(--ink);margin:3px 0}
.sidecard{display:flex;flex-direction:column;gap:12px}
.say{font-size:1.06rem;max-width:62ch}
.say.done{background:var(--goodbg);border-radius:12px;padding:10px 14px}
.step-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.progress{font-size:.85rem;color:var(--muted)}
.dotsvis{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--soft);border-radius:14px;padding:12px}
.dot{width:18px;height:18px;border-radius:50%;background:var(--pc,var(--c0));display:inline-block;flex:none}
.dot.gone{background:transparent;border:2.5px dashed var(--pc,var(--c0));opacity:.7}
.ring{display:grid;grid-template-columns:repeat(5,18px);gap:5px;border:3px dashed var(--ink);border-radius:14px;padding:7px}
.rest{display:flex;flex-wrap:wrap;gap:5px;max-width:260px}
.arrow{font:700 1.6rem var(--fd)}
.cap{width:100%;font-size:.92rem;color:var(--muted)}

/* ---------- skip counting ---------- */
.numline{display:block;min-width:640px;width:100%;color:var(--ink)}
.frog{transition:transform .5s ease-in-out}
.frog-in.jump{animation:arc .5s ease-in-out}
@keyframes arc{50%{transform:translateY(-48px)}}
.hundred{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;max-width:470px}
.hundred span{aspect-ratio:1;display:grid;place-items:center;font-size:.8rem;border-radius:7px;background:var(--soft);color:var(--muted)}
.hundred span.hit{background:color-mix(in srgb,var(--c0) 35%,var(--card));color:var(--ink);font-weight:600}
.hundred span.reached{background:var(--c0);color:#fff;font-weight:700}

/* ---------- multiplication ---------- */
.array{display:grid;gap:7px;justify-content:start;padding:14px;background:var(--soft);border-radius:16px;width:max-content;max-width:100%;transition:transform .35s ease}
.array.spin{transform:rotate(90deg) scale(.85)}
.array .dot{width:22px;height:22px}
.array.small .dot{width:16px;height:16px}
.sliders{display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;align-items:center;max-width:460px;margin:10px 0}
.sliders input[type=range]{width:100%;accent-color:var(--c4);height:30px}
.eq{font:700 clamp(1.5rem,5vw,2.1rem) var(--fd)}
.groups{display:flex;flex-direction:column;gap:6px}
.grp{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--soft);border-radius:12px;flex-wrap:wrap}
.grp b{font:600 .95rem var(--fd);min-width:2.4em}
.rod{width:11px;height:48px;border-radius:3px;background-color:var(--c1);border:1.5px solid rgba(0,0,0,.28);background-image:repeating-linear-gradient(to bottom,transparent 0 3.5px,rgba(0,0,0,.26) 3.5px 4.6px);flex:none;display:inline-block}
.rod.sm{height:34px;width:9px}
.odot{width:13px;height:13px;border-radius:50%;background:var(--c0);flex:none;display:inline-block}
.odot.new{animation:pop .35s ease}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
@media (max-width:780px){.two-col{grid-template-columns:1fr}}

/* ---------- division ---------- */
.bank{border:2.5px dashed var(--line);border-radius:16px;padding:12px 14px;min-height:96px;display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end}
.bank-label{width:100%;font-size:.88rem;color:var(--muted)}
.plates{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:14px;margin:16px 0}
.plate{position:relative;border-radius:50%;aspect-ratio:1;border:3px solid var(--line);background:var(--soft);display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:4px;padding:20px 18px 26px}
.plate small{position:absolute;bottom:9px;left:0;right:0;text-align:center;font-size:.72rem;color:var(--muted)}
.tri svg{width:220px;height:auto;display:block;color:var(--ink)}
.facts{display:grid;grid-template-columns:repeat(2,max-content);gap:8px 22px;font:600 1.3rem var(--fd)}

/* ---------- word problems ---------- */
.story{font-size:1.2rem;line-height:1.6;max-width:62ch;background:var(--soft);border-radius:16px;padding:16px 18px}
.ops{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:16px 0}
@media (max-width:560px){.ops{grid-template-columns:repeat(2,minmax(0,1fr))}}
.op-btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px}
.op-btn span{font:700 2rem var(--fd);line-height:1}
.op-btn.right{background:var(--goodbg);border-color:var(--good)}
.op-btn.wrong{background:var(--badbg);border-color:var(--bad)}
.bar{display:flex;flex-direction:column;gap:6px;margin:12px 0;max-width:640px}
.bar-row{display:flex;gap:4px}
.seg{border:2.5px solid var(--edge);border-radius:8px;padding:8px 4px;text-align:center;font:600 .95rem var(--fb);min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.seg.q{border-style:dashed;background:var(--card)}
.seg.partial{opacity:.55;border-style:dashed}
.brace{text-align:center;font:600 .95rem var(--fb);color:var(--muted);border-top:2.5px solid var(--muted);border-radius:0 0 12px 12px;padding-top:4px}

/* ---------- quiz ---------- */
.quiz{max-width:760px;margin:0 auto 24px}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.qdots{display:flex;gap:7px;flex-wrap:wrap}
.qdots span{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--edge);background:var(--card)}
.qdots span.cur{background:var(--c1)}
.qdots span.ok{background:var(--good);border-color:var(--good)}
.qdots span.no{background:var(--bad);border-color:var(--bad)}
.qprompt{font-size:clamp(1.15rem,3.4vw,1.4rem);line-height:1.55;margin-bottom:14px}
.qprompt b{font-weight:600}
.qvisual{margin:6px 0 16px}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.choice{font:600 1.15rem var(--fb);padding:14px 10px;min-height:58px}
.choice.right{background:var(--goodbg);border-color:var(--good)}
.choice.wrong{background:var(--badbg);border-color:var(--bad)}
.answer-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.answer-row .pre{font:700 1.3rem var(--fd)}
.answer-row .unit{color:var(--muted)}
.feedback:empty{display:none}
.feedback{margin-top:18px;border-radius:14px;padding:14px 16px;border:2.5px solid;font-size:1.02rem}
.feedback.good{background:var(--goodbg);border-color:var(--good)}
.feedback.bad{background:var(--badbg);border-color:var(--bad)}
.fb-actions{margin-top:12px}
.stack{display:inline-flex;flex-direction:column;align-items:flex-end;font:600 1.8rem var(--fb);font-variant-numeric:tabular-nums;letter-spacing:.16em;background:var(--soft);border-radius:14px;padding:10px 18px}
.srow{display:flex;gap:.5em}
.sline{border-top:3.5px solid var(--ink);align-self:stretch;margin-top:4px;height:1.3em}
.blank{display:inline-block;width:3.4em;height:1.35em;border:2.5px solid var(--edge);border-radius:8px;vertical-align:middle;background:var(--card)}
.result{text-align:center;max-width:620px;margin:0 auto}
.big-stars{font-size:3.6rem;letter-spacing:6px;line-height:1.1;margin-bottom:8px}
.big-stars .on{color:var(--t1)}
.big-stars .off{color:var(--line)}
.result h2{font-size:2rem;margin-bottom:6px}
.result-actions{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:18px}

/* ---------- toast & confetti ---------- */
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 74px);transform:translate(-50%,-12px);opacity:0;pointer-events:none;background:var(--ink);color:var(--paper);font:600 1rem var(--fd);padding:11px 20px;border-radius:999px;z-index:60;transition:opacity .2s ease,transform .2s ease;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti i{position:absolute;top:-16px;width:10px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}

@media (max-width:560px){
  body{font-size:16px}
  .panel{padding:16px;border-radius:16px;box-shadow:4px 4px 0 var(--shadow)}
  .choices{grid-template-columns:1fr}
  .wheel small{font-size:.6rem}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

<body>
<header class="topbar">
  <div class="topbar-in">
    <button class="brand" id="brand" aria-label="Go to the start page">
      <span class="mark" aria-hidden="true"><i style="background:var(--c0)"></i><i style="background:var(--c6)"></i><i style="background:var(--c3)"></i></span>

<div class="confetti" id="confetti" aria-hidden="true"></div>

<script>
/* =====================================================================
   TUTOR SETTINGS: send quiz results to your Google Sheet
   Paste the Web app URL from Google Apps Script between the quotes,
   and use the same secret word you set in the script.
   Leave SHEET_URL empty to keep results on the student's device only.
   ===================================================================== */
var SHEET_URL = '';
var SHEET_KEY = 'change-me';
</script>
<script>
(function(){
'use strict';

/* ================= helpers ================= */
var app = document.getElementById('app');
function h(tag, attrs){
  var e = document.createElement(tag);
  if (attrs) for (var k in attrs){
    var v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k.slice(0,2) === 'on') e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  var kids = Array.prototype.slice.call(arguments, 2);
  (function add(list){
    list.forEach(function(x){
      if (x == null || x === false) return;
      if (Array.isArray(x)) return add(x);
      e.append(x.nodeType ? x : document.createTextNode(String(x)));
    });
  })(kids);
  return e;
}
var fmt = function(n){ return Number(n).toLocaleString('en-US'); };
var rnd = function(a,b){ return a + Math.floor(Math.random()*(b-a+1)); };
var pick = function(a){ return a[Math.floor(Math.random()*a.length)]; };
var shuffle = function(a){ a = a.slice(); for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; };
var times = function(n, f){ var o=[]; for (var i=0;i<n;i++) o.push(f(i)); return o; };
var MINUS='\u2212', TIMES='\u00d7', DIVS='\u00f7';
var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

var PV = [
  {n:'ones', one:'one', lab:'1', ab:'O', v:1},
  {n:'tens', one:'ten', lab:'10', ab:'T', v:10},
  {n:'hundreds', one:'hundred', lab:'100', ab:'H', v:100},
  {n:'thousands', one:'thousand', lab:'1,000', ab:'Th', v:1000},
  {n:'ten thousands', one:'ten thousand', lab:'10,000', ab:'TTh', v:10000},
  {n:'hundred thousands', one:'hundred thousand', lab:'100,000', ab:'HTh', v:100000}
];
var POS = {10:1, 100:2, 1000:3, 10000:4};
var cap = function(s){ return s.charAt(0).toUpperCase() + s.slice(1); };
function digitsOf(n, len){ var s=String(n), d=[]; for (var i=s.length-1;i>=0;i--) d.push(+s[i]); if (len) while (d.length<len) d.push(0); return d; }
function colored(n){
  var s=String(n), out='';
  for (var i=0;i<s.length;i++){ var p=s.length-1-i; out += '<span style="color:var(--t'+Math.min(p,5)+')">'+s[i]+'</span>'; if (p>0 && p%3===0) out += '<span class="cm">,</span>'; }
  return out;
}
var ONES=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
var TENS=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function w100(n){ return n<20 ? ONES[n] : TENS[Math.floor(n/10)] + (n%10 ? '-'+ONES[n%10] : ''); }
function w1000(n){ var hh=Math.floor(n/100), r=n%100, s = hh ? ONES[hh]+' hundred' : ''; if (r) s += (s?' ':'') + w100(r); return s; }
function words(n){ if (n===0) return 'zero'; var th=Math.floor(n/1000), r=n%1000, s = th ? w1000(th)+' thousand' : ''; if (r) s += (s?', ':'') + w1000(r); return s; }
function expanded(n){ var d=digitsOf(n), parts=[]; for (var p=d.length-1;p>=0;p--) if (d[p]) parts.push(fmt(d[p]*Math.pow(10,p))); return parts.join(' + ') || '0'; }
function randNum(digits, zeros){ var s=String(rnd(1,9)); for (var i=1;i<digits;i++) s += (zeros && Math.random()<zeros) ? '0' : String(rnd(0,9)); return +s; }
function carries(a,b){ var c=0,n=0; while (a||b){ var s=a%10+b%10+c; c = s>=10?1:0; n+=c; a=Math.floor(a/10); b=Math.floor(b/10); } return n; }
function borrows(a,b){ var br=0,n=0; while (a||b){ var d=a%10-b%10-br; br = d<0?1:0; n+=br; a=Math.floor(a/10); b=Math.floor(b/10); } return n; }
function starsHTML(n){ var s=''; for (var i=0;i<3;i++) s += '<span class="'+(i<n?'on':'off')+'">\u2605</span>'; return s; }
function parseNum(v){ return v.replace(/[,\s]/g,''); }

var toastTimer;
function toast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(function(){ t.classList.remove('show'); }, 2300); }
function confetti(){
  if (reduceMotion) return;
  var c=document.getElementById('confetti'); c.innerHTML='';
  var cols=['var(--c0)','var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)'];
  for (var i=0;i<70;i++){ var p=document.createElement('i'); p.style.left=(Math.random()*100)+'vw'; p.style.background=cols[i%6]; p.style.animationDelay=(Math.random()*.5)+'s'; p.style.animationDuration=(1.5+Math.random()*1.2)+'s'; c.appendChild(p); }
  setTimeout(function(){ c.innerHTML=''; }, 3200);
}

/* ================= learners & saved progress ================= */
/* Progress is kept per learner. It always saves in this browser, and when the page runs
   inside Claude with its database available it also saves there, so it follows the learner
   to any device where the page is opened while signed in. */
var LS_KEY='area-workshop-v1', LS_CUR='area-workshop-current';
var learners={}, currentId=null;
var cloud={db:null, writable:true, ready:false};
var writeChain={};
function esc(t){ return String(t).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function lsLoad(){
  try { var o=JSON.parse(localStorage.getItem(LS_KEY)||'{}'); learners=(o && o.students) || {}; } catch(e){ learners={}; }
  try { currentId=localStorage.getItem(LS_CUR); } catch(e){ currentId=null; }
  if (!learners[currentId]) currentId=null;
}
function lsSave(){
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({students:learners}));
    if (currentId) localStorage.setItem(LS_CUR, currentId); else localStorage.removeItem(LS_CUR);
  } catch(e){}
}
function me(){ return currentId ? learners[currentId] || null : null; }
function learnerName(){ var s=me(); return s ? s.name : 'Sam'; }
function bestOf(mid, s){ s = s || me(); return (s && s.best && s.best[mid]) || 0; }
function totalStars(s){ var t=0; MODULES.forEach(function(m){ t += bestOf(m.id, s); }); return t; }
function newLearner(name){
  var base=name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,24) || 'learner';
  return {id:base+'-'+Math.random().toString(36).slice(2,7), name:name, createdAt:Date.now(), updatedAt:Date.now(), best:{}, plays:{}, attempts:[], skills:{}};
}
function cloudSet(s){
  var body=JSON.parse(JSON.stringify(s));
  return cloud.db.collection('students').doc(s.id).set(body);
}
function cloudWrite(s){
  if (!cloud.db || !cloud.writable) return;
  var prev = writeChain[s.id] || Promise.resolve();
  writeChain[s.id] = prev.then(function(){ return cloudSet(s); }).catch(function(e){
    if (e && e.code==='unavailable'){
      return new Promise(function(r){ setTimeout(r, 700+Math.random()*900); }).then(function(){ return cloudSet(s); }).catch(onWriteFail);
    }
    onWriteFail(e);
  });
}
function onWriteFail(e){
  if (!cloud.writable) return;
  cloud.writable=false;
  toast(e && e.code==='quota_exceeded' ? 'The progress store is full. Progress is saved on this device only.' : 'Progress is saved on this device only.');
  refreshChrome();
}
function persist(s){ s.updatedAt=Date.now(); learners[s.id]=s; lsSave(); cloudWrite(s); refreshChrome(); }
function removeLearner(id){
  delete learners[id]; if (currentId===id) currentId=null; lsSave();
  if (cloud.db && cloud.writable) cloud.db.collection('students').doc(id).delete().catch(function(){});
  refreshChrome();
}
function selectLearner(id){ currentId=id; lsSave(); refreshChrome(); go('home'); }
function recordResult(mid, score, total, stars, qs, results){
  var s=me(); if (!s) return;
  s=JSON.parse(JSON.stringify(s));
  s.best=s.best||{}; s.plays=s.plays||{}; s.skills=s.skills||{}; s.attempts=s.attempts||[];
  if (stars>(s.best[mid]||0)) s.best[mid]=stars;
  s.plays[mid]=(s.plays[mid]||0)+1;
  var missed=[];
  qs.forEach(function(q,i){ if (!q.key) return; var k=s.skills[q.key]||{r:0,w:0}; if (results[i]) k.r++; else { k.w++; missed.push(q.key); } s.skills[q.key]=k; });
  s.attempts=s.attempts.concat([{m:mid, score:score, total:total, stars:stars, at:Date.now(), missed:missed}]).slice(-80);
  persist(s);
}
function refreshChrome(){
  var s=me(), sc=document.getElementById('starcount'), who=document.getElementById('who');
  if (s){
    sc.innerHTML='<b>\u2605</b> '+totalStars(s)+' of '+(MODULES.length*3);
    who.textContent=s.name; who.classList.remove('hidden');
    sc.classList.remove('hidden');
  } else { sc.classList.add('hidden'); who.classList.add('hidden'); }
}
function initCloud(){
  if (!(window.claude && typeof window.claude.use==='function')) return;
  window.claude.use('db').then(function(db){
    if (!db) return;
    cloud.db=db;
    db.collection('students').onSnapshot(function(snap){
      var first=!cloud.ready, seen={}, pushBack=[];
      snap.docChanges().forEach(function(ch){
        var c=ch.doc.data(); var id=ch.doc.id;
        if (ch.type==='removed'){ if (!first) delete learners[id]; return; }
        if (!c || !c.name) return;
        var l=learners[id];
        if (!l || (c.updatedAt||0)>=(l.updatedAt||0)) learners[id]=JSON.parse(JSON.stringify(c));
        else if (first) pushBack.push(l);
      });
      snap.docs.forEach(function(d){ seen[d.id]=1; });
      if (first){
        cloud.ready=true;
        Object.keys(learners).forEach(function(id){ if (!seen[id]) pushBack.push(learners[id]); });
        pushBack.forEach(cloudWrite);
      }
      if (!learners[currentId]) currentId=null;
      lsSave(); onDataChanged();
    }, function(){ /* keep working from this device */ });
  }).catch(function(){});
}
function onDataChanged(){
  refreshChrome();
  var v=location.hash.replace('#','').split('/')[0];
  if (v==='' || v==='home' || v==='welcome' || v==='progress') route(true);
}
/* ---------- results to Google Sheet (queued, so nothing is lost offline) ---------- */
var OUTBOX='area-workshop-outbox', flushing=false;
function sheetOn(){ return typeof SHEET_URL==='string' && /^https:\/\/script\.google(usercontent)?\.com\//.test(SHEET_URL.trim()); }
function outboxLoad(){ try { return JSON.parse(localStorage.getItem(OUTBOX)||'[]') || []; } catch(e){ return []; } }
function outboxSave(a){ try { localStorage.setItem(OUTBOX, JSON.stringify(a.slice(-300))); } catch(e){} }
function flushOutbox(){
  if (!sheetOn() || flushing || !window.fetch) return;
  var box=outboxLoad(); if (!box.length) return;
  flushing=true;
  var row=box[0];
  window.fetch(SHEET_URL.trim(), {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(row)})
    .then(function(){
      outboxSave(outboxLoad().filter(function(r){ return r.uid!==row.uid; }));
      flushing=false; flushOutbox();
    })
    .catch(function(){ flushing=false; setTimeout(flushOutbox, 60000); });
}
function queueResult(s, m, score, total, stars, missedKeys){
  if (!sheetOn() || !s) return;
  var box=outboxLoad();
  box.push({uid:Date.now().toString(36)+Math.random().toString(36).slice(2,7), key:SHEET_KEY,
    learner:s.name, learnerId:s.id, stop:'A&P '+m.n+'. '+m.title, score:score, total:total, stars:stars,
    missed:missedKeys.map(function(k){ return SKILL[k]||k; }), finishedAt:new Date().toLocaleString()});
  outboxSave(box); flushOutbox();
}
window.addEventListener('online', flushOutbox);

var SKILL={pvValue:'Value of a digit',pvStandard:'Expanded form to standard form',pvCompare:'Comparing numbers',pvRound:'Rounding',pvWords:'Number names in words',pvMoreLess:'10, 100, 1,000 more or less',
  addCompute:'Adding with carrying',addNoCarry:'Adding without carrying',addEstimate:'Estimating a sum',addMissing:'Missing number in addition',addError:'Fixing a carrying mistake',addFirstCarry:'Spotting where to carry',
  subCompute:'Subtracting with borrowing',subZeros:'Borrowing across zeros',subCheck:'Checking subtraction with addition',subMissing:'Missing number in subtraction',subRight:'Checking someone else\u2019s subtraction',
  skipNext:'Skip counting forward',skipBack:'Skip counting backward',skipRule:'Finding a pattern rule',skipNotSaid:'Which numbers get skipped',skipTimes:'Skip counting to multiply',
  mulFact:'Times table facts',mulArray:'Reading an array',mulBreak:'Break-apart multiplying',mul2x1:'2-digit \u00d7 1-digit',mulTurn:'Turn-around facts',mulWord:'Multiplication story problems',
  divFact:'Division facts',div2:'2-digit \u00f7 1-digit',divRem:'Division with remainders',divNotRem:'The remainder rule',divCars:'What to do with a remainder',divFamily:'Fact families',divMissing:'Missing number in division',
  apCount:'Area by counting squares',apArea:'Area of a rectangle',apPerim:'Perimeter of a rectangle',apSquare:'Squares: area and perimeter',apChoose:'Choosing area or perimeter',apMissArea:'Missing side from the area',apMissPerim:'Missing side from the perimeter',apSame:'Same area, different perimeter',apL:'Area of an L-shape',apLPerim:'Perimeter of an L-shape',apWord:'Area and perimeter story problems',
  msSolve:'Solving multi-step stories',msFirst:'Choosing the first step',msPlan:'Planning the steps',
  wordOp:'Choosing the operation',wordSolve:'Solving story problems'};

/* ================= shared visuals ================= */
function stackHTML(a,b,op){

      'You said: <b>'+nums.join(', ')+'</b><br>'+hops+' hop'+(hops>1?'s':'')+' of '+step+' is '+hops+' '+TIMES+' '+step+' = <b>'+fmt(hops*step)+'</b>';
    hop.disabled = hops>=MAXH;
    chart.innerHTML='';
    if (step<=10){
      chartNote.textContent='The numbers you say when counting by '+step+'s are coloured. The dark ones are where the frog has landed. Can you see the pattern?';
      for (var v=1;v<=100;v++) chart.append(h('span',{class:(v%step===0 ? (v<=hops*step?'reached':'hit') : '')}, v));
      chart.classList.remove('hidden');
    } else {
      chartNote.textContent = step===25 ? 'Counting by 25s jumps over most of a hundred chart. Look at the number line instead: the numbers always end in 25, 50, 75 or 00, just like quarters in a dollar.' :
        'Counting by 100s: only the hundreds digit changes each time. Everything else stays the same.';
      chart.classList.add('hidden');
    }
  }
  function doHop(){
    if (hops>=MAXH) return;
    hops++; draw(hops-1);
    var g=lineBox.querySelector('.frog'), inner=lineBox.querySelector('.frog-in');
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ g.style.transform='translateX('+X(hops)+'px)'; inner.classList.add('jump'); }); });
  }
  draw(0);
}

function divStates(a,d){
  var T=Math.floor(a/10), O=a%10, S=[];
  S.push({bt:T,bo:O,pt:0,po:0,msg:a+' is '+T+' ten'+(T===1?'':'s')+' and '+O+' one'+(O===1?'':'s')+'. Let\u2019s share them equally onto '+d+' plates.'});
  var t1=Math.floor(T/d), tl=T%d;
  S.push({bt:tl,bo:O,pt:t1,po:0,msg: t1>0 ? 'Share the tens first: '+T+' tens '+DIVS+' '+d+' = '+t1+' ten'+(t1>1?'s':'')+' on each plate'+(tl?', with '+tl+' ten'+(tl>1?'s':'')+' left over.':'.') :
    'There are only '+T+' tens. That is not enough to give every plate a ten, so keep them for now.'});
  var ones=O;
  if (tl>0){ ones=O+10*tl; S.push({bt:0,bo:ones,pt:t1,po:0,trade:true,msg:'Trade the '+tl+' leftover ten'+(tl>1?'s':'')+' for '+(10*tl)+' ones. Now there are '+ones+' ones to share.'}); }
  var o1=Math.floor(ones/d), r=ones%d;
  S.push({bt:0,bo:r,pt:t1,po:o1,msg:'Share the ones: '+ones+' '+DIVS+' '+d+' = '+o1+' on each plate'+(r?', with '+r+' left over.':'.')});
  var q=t1*10+o1;
  S.push({bt:0,bo:r,pt:t1,po:o1,done:true,msg:'Each plate has <b>'+q+'</b>. So <b>'+a+' '+DIVS+' '+d+' = '+q+(r?' r'+r:'')+'</b>. '+
    (r ? 'The '+r+' left over is the <b>remainder</b>. It is less than '+d+', so it cannot go round all the plates again. ' : '')+
    'Check: '+d+' '+TIMES+' '+q+(r?' + '+r:'')+' = '+a+'.'});
  return S;
}

function learnMulti(root){
  var idx=0;
  root.append(h('section',{class:'panel'},
    h('h2',{},'Big stories, small steps'),
    h('p',{class:'hint'},'Some stories can’t be solved with one sum. Find one thing first, then use that answer in the next step.'),
    h('div',{class:'method'}, [['1','Read','What do I know? What must I find?'],['2','Plan','What do I find first?'],['3','Solve','One step at a time.'],['4','Check','Does it make sense?']].map(function(m){
      return h('div',{class:'mstep'}, h('b',{}, m[0]+'. '+m[1]), h('span',{}, m[2])); }))));
  var panel=h('section',{class:'panel'}); root.append(panel);
  function show(){
    var s=MS[idx], i=0, solved=[];
    panel.innerHTML='';
    var trail=h('div',{class:'trail', role:'img', 'aria-label':'Answer trail'}), plan=h('ol',{class:'plan'}), work=h('div',{class:'mwork'}), fb=h('div',{class:'feedback', role:'status','aria-live':'polite'});
    panel.append(h('p',{class:'progress'},'Story '+(idx+1)+' of '+MS.length+' • '+s.steps.length+' steps'), h('p',{class:'story', html:s.t}),
      h('p',{class:'cap', style:'margin:14px 0 6px'},'Answer trail'), trail, plan, work, fb);
    function drawTrail(){
      trail.innerHTML='';
      s.steps.forEach(function(st,k){
        if (k) trail.append(h('span',{class:'tarrow','aria-hidden':'true'},'→'));
        var done=k<solved.length, last=k===s.steps.length-1;
        trail.append(h('div',{class:'tnode'+(done?' done':'')+(k===i&&!done?' now':'')+(last?' last':'')},
          h('b',{}, done ? fmt(st.res) : '?'), h('span',{}, done ? st.label : (last ? 'answer' : 'step '+(k+1)))));
      });
    }
    function stage(){
      drawTrail(); work.innerHTML='';
      if (i>=s.steps.length){
        fb.className='feedback good';
        fb.innerHTML='<b>Solved!</b> '+s.final+'<br>Check: '+s.check;
        fb.append(h('div',{class:'fb-actions'}, idx<MS.length-1 ? h('button',{class:'btn go', onclick:function(){ idx++; show(); }},'Next story') :
          h('button',{class:'btn go', onclick:function(){ idx=0; show(); }},'Start the stories again')));
        return;
      }
      var st=s.steps[i];
      var opts=shuffle([{t:st.find, ok:true}].concat(st.not));
      var row=h('div',{class:'choices'});
      opts.forEach(function(o){
        var b=h('button',{class:'btn choice', onclick:function(){
          if (o.ok){ b.classList.add('right'); Array.prototype.forEach.call(row.children,function(x){ x.disabled=true; }); fb.className='feedback'; fb.innerHTML=''; pickOp(st); }
          else { b.classList.add('wrong'); b.disabled=true; fb.className='feedback bad'; fb.innerHTML='<b>Not yet.</b> '+o.why; }
        }}, o.t);
        row.append(b);
      });
      work.append(h('p',{class:'ask'}, 'Step '+(i+1)+': What should we find '+(i? 'next':'first')+'?'), row);
    }
    function pickOp(st){
      var ops=h('div',{class:'ops'});
      Object.keys(OPS).forEach(function(key){
        var b=h('button',{class:'btn op-btn', onclick:function(){
          if (key===st.op){ b.classList.add('right'); Array.prototype.forEach.call(ops.children,function(x){ x.disabled=true; }); fb.className='feedback good'; fb.innerHTML='<b>Yes.</b> '+st.why; solve(st); }
          else { b.classList.add('wrong'); b.disabled=true; fb.className='feedback bad'; fb.innerHTML='<b>Not this one.</b> Think: is it joining, taking away, equal groups, or sharing?'; }
        }}, h('span',{}, OPS[key].sym), OPS[key].name);
        ops.append(b);
      });
      work.append(h('p',{class:'ask'}, st.find+'. Which operation?'), ops);
    }
    function solve(st){
      var inp=h('input',{type:'text',inputmode:'numeric',autocomplete:'off',class:'ans sm','aria-label':'Answer for this step'});
      var chk=h('button',{class:'btn go'},'Check');
      var go2=function(){
        var v=parseNum(inp.value); if (v===''){ toast('Type your answer first.'); inp.focus(); return; }
        if (Number(v)===st.res){
          inp.classList.add('right'); inp.disabled=true; chk.disabled=true;
          solved.push(st); plan.append(h('li',{}, h('span',{}, st.find), h('b',{}, st.show+' '+fmt(st.res))));
          i++; fb.className='feedback'; fb.innerHTML='';
          setTimeout(stage, reduceMotion?0:350);
        } else {
          inp.classList.add('wrong'); fb.className='feedback bad';
          fb.innerHTML = (st.near && st.near[Number(v)]) ? '<b>So close.</b> '+st.near[Number(v)] : '<b>Not quite.</b> Work out '+esc(st.show.replace(/ =.*$/,''))+' carefully and try again.';
          setTimeout(function(){ inp.classList.remove('wrong'); }, 900);
        }
      };
      chk.addEventListener('click', go2);
      inp.addEventListener('keydown', function(e){ if (e.key==='Enter') go2(); });
      work.append(h('div',{class:'answer-row', style:'margin-top:14px'}, h('span',{class:'eq'}, st.show), inp, chk));
      setTimeout(function(){ inp.focus(); }, 40);
    }
    stage();
  }
  show();
}

var SVGNS='http://www.w3.org/2000/svg';
function gridSVG(r, c, opts){
  opts=opts||{};
  var cell=opts.cell||Math.min(40, Math.floor(320/Math.max(c,1)), Math.floor(220/Math.max(r,1))), W=c*cell, H=r*cell, pad=10;

  out+='<rect x="'+pad+'" y="'+pad+'" width="'+W+'" height="'+H+'" style="fill:var(--c0)"/>';
  var d='';
  for (var i=1;i<r;i++) d+='M'+pad+' '+(pad+i*cell)+'H'+(pad+W);
  for (var j=1;j<c;j++) d+='M'+(pad+j*cell)+' '+pad+'V'+(pad+H);
  if (d) out+='<path d="'+d+'" stroke="currentColor" stroke-width="2"/>';
  out+='<rect x="'+pad+'" y="'+pad+'" width="'+W+'" height="'+H+'" fill="none" stroke="'+(opts.perim?'var(--c6)':'currentColor')+'" stroke-width="'+(opts.perim?6:3)+'"/></svg>';
  return out;
}
function rectSVG(L, Wd, unit, o){
  o=o||{};
  var maxW=300, maxH=170, ratio=Math.max(.35, Math.min(3.2, L/Wd)), w=maxW, hh=w/ratio;
  if (hh>maxH){ hh=maxH; w=hh*ratio; }
  var lx=70, ty=34, VW=lx+w+40, VH=ty+hh+20;
  var top = o.top!=null ? o.top : L+' '+unit, side = o.side!=null ? o.side : Wd+' '+unit;
  var out='<svg class="apsvg" viewBox="0 0 '+VW+' '+VH+'" width="'+VW+'" height="'+VH+'" role="img" aria-label="Rectangle '+esc(top)+' by '+esc(side)+'">';
  out+='<rect x="'+lx+'" y="'+ty+'" width="'+w+'" height="'+hh+'" rx="4" style="fill:var(--card)" stroke="'+(o.perim?'var(--c6)':'currentColor')+'" stroke-width="'+(o.perim?6:3.5)+'"/>';
  if (o.square){ out+='<path d="M'+(lx+w/2)+' '+(ty-6)+'v12M'+(lx+w/2)+' '+(ty+hh-6)+'v12M'+(lx-6)+' '+(ty+hh/2)+'h12M'+(lx+w-6)+' '+(ty+hh/2)+'h12" stroke="currentColor" stroke-width="2"/>'; }
  out+='<text x="'+(lx+w/2)+'" y="'+(ty-12)+'" text-anchor="middle" font-size="17" font-weight="700" fill="currentColor">'+esc(top)+'</text>';
  out+='<text x="'+(lx-12)+'" y="'+(ty+hh/2+6)+'" text-anchor="end" font-size="17" font-weight="700" fill="currentColor">'+esc(side)+'</text>';
  if (o.inside){ o.inside.forEach(function(t,k){ out+='<text x="'+(lx+w/2)+'" y="'+(ty+hh/2+6+(k-(o.inside.length-1)/2)*20)+'" text-anchor="middle" font-size="15" fill="currentColor">'+esc(t)+'</text>'; }); }

function LSVG(W, H, w2, h2, unit, o){
  o=o||{};

  var X=function(x){ return ox+x*s; }, Y=function(y){ return oy+(H-y)*s; };
  var pts=[[0,0],[W,0],[W,h2],[w2,h2],[w2,H],[0,H]].map(function(p){ return X(p[0])+' '+Y(p[1]); }).join(' L');
  var out='<svg class="apsvg" viewBox="0 0 '+(ox+pw+70)+' '+(oy+ph+40)+'" width="'+(ox+pw+70)+'" height="'+(oy+ph+40)+'" role="img" aria-label="L-shape '+W+' by '+H+'">';
  if (o.split==='down'){
    out+='<rect x="'+X(0)+'" y="'+Y(H)+'" width="'+(w2*s)+'" height="'+(H*s)+'" style="fill:var(--c0)"/>';
    out+='<rect x="'+X(w2)+'" y="'+Y(h2)+'" width="'+((W-w2)*s)+'" height="'+(h2*s)+'" style="fill:var(--c1)"/>';

  if (o.split==='down') out+='<path d="M'+X(w2)+' '+Y(h2)+'V'+Y(0)+'" stroke="currentColor" stroke-width="3" stroke-dasharray="8 6"/>';
  if (o.split==='across') out+='<path d="M'+X(0)+' '+Y(h2)+'H'+X(w2)+'" stroke="currentColor" stroke-width="3" stroke-dasharray="8 6"/>';

  }
  return out+'</svg>';
}
function learnArea(root){

      tried[li+':'+mode]=1;
      lsay.append(h('p',{class:'say'}, t1), h('p',{class:'say'}, t2), h('p',{class:'say done', html:'Area = '+a1+' + '+a2+' = <b>'+(a1+a2)+' square '+u+'</b>'}));
      if (tried[li+':down'] && tried[li+':across']) lsay.append(h('p',{class:'hint'},'Both cuts give the same area. Cut whichever way is easier!'));
    }
    if (showMiss) lsay.append(h('p',{class:'say', html:'Hidden sides: '+W+' '+MINUS+' '+w2+' = '+(W-w2)+' and '+H+' '+MINUS+' '+h2+' = '+(H-h2)+'.<br>Perimeter = '+[W,h2,W-w2,H-h2,w2,H].join(' + ')+' = <b>'+(2*(W+H))+' '+u+'</b>'}));
  }
  root.append(h('section',{class:'panel'},
    h('h2',{},'Split an L-shape'),
    h('p',{class:'hint'},'An L-shape is two rectangles stuck together. Cut it, find each area, then add.'),
    lchips,
    h('div',{class:'two-col'}, h('div',{class:'scroll-x'}, lfig),
      h('div',{}, lsay, h('div',{class:'step-actions', style:'margin-top:14px'},
        h('button',{class:'btn', onclick:function(){ mode='down'; drawL(); }},'Cut down'),
        h('button',{class:'btn', onclick:function(){ mode='across'; drawL(); }},'Cut across'),
        h('button',{class:'btn ap-p', onclick:function(){ showMiss=!showMiss; drawL(); }},'Find the perimeter'))))));
  drawL();
}

G.apSame = function(){ var N=pick([12,16,18,24,36]), pairs=[]; for (var a=1;a*a<=N;a++) if (N%a===0) pairs.push([a,N/a]);

/* ================= MODULES ================= */
/* ================= AREA & PERIMETER WORKSHOP: learn panels ================= */
function apPanelBuild(root, focus){
  var r=3, c=5, anim=null;
  var stage=h('div',{class:'apstage'}), readA=h('p',{class:'say'}), readP=h('p',{class:'say'});
  var rs=h('input',{type:'range',min:1,max:10,value:r,'aria-label':'Rows'}), cs=h('input',{type:'range',min:1,max:10,value:c,'aria-label':'Columns'});
  var rl=h('b'), cl=h('b');
  rs.addEventListener('input', function(){ r=+rs.value; draw(); });
  cs.addEventListener('input', function(){ c=+cs.value; draw(); });
  function stop(){ if (anim){ clearInterval(anim); anim=null; } }
  function draw(mode){
    stop(); rl.textContent=r; cl.textContent=c;
    var cell=Math.min(44, Math.floor(440/c), Math.floor(300/r)), W=c*cell, H=r*cell, pad=14;
    var svg=document.createElementNS(SVGNS,'svg');
    svg.setAttribute('viewBox','0 0 '+(W+2*pad)+' '+(H+2*pad)); svg.setAttribute('width',W+2*pad); svg.setAttribute('height',H+2*pad);
    svg.setAttribute('class','apsvg'); svg.setAttribute('role','img'); svg.setAttribute('aria-label', r+' rows of '+c+' squares');
    var cells=[];
    for (var i=0;i<r;i++) for (var j=0;j<c;j++){
      var rc=document.createElementNS(SVGNS,'rect');
      rc.setAttribute('x',pad+j*cell); rc.setAttribute('y',pad+i*cell); rc.setAttribute('width',cell); rc.setAttribute('height',cell);
      rc.setAttribute('style', (mode==='count' || focus==='perim') ? 'fill:var(--card)' : 'fill:var(--c0)'); rc.setAttribute('stroke', focus==='perim' ? 'var(--line)' : 'currentColor'); rc.setAttribute('stroke-width','2');
      var tx=document.createElementNS(SVGNS,'text');
      tx.setAttribute('x',pad+j*cell+cell/2); tx.setAttribute('y',pad+i*cell+cell/2+5); tx.setAttribute('text-anchor','middle');
      tx.setAttribute('font-size', Math.max(10, Math.min(15, Math.round(cell/2.6)))); tx.setAttribute('font-weight','700'); tx.setAttribute('fill','currentColor');
      svg.appendChild(rc); svg.appendChild(tx); cells.push({rc:rc,tx:tx});
    }
    var segs=[];
    function seg(x1,y1,x2,y2){ var l=document.createElementNS(SVGNS,'line'); l.setAttribute('x1',x1); l.setAttribute('y1',y1); l.setAttribute('x2',x2); l.setAttribute('y2',y2);
      l.setAttribute('stroke', mode==='walk' ? 'var(--line)' : (focus==='perim' ? 'var(--c6)' : 'currentColor')); l.setAttribute('stroke-width', mode==='walk' || focus==='perim' ? 7 : 4); l.setAttribute('stroke-linecap','round'); svg.appendChild(l); segs.push(l); }
    var a, b;
    for (a=0;a<c;a++) seg(pad+a*cell, pad, pad+(a+1)*cell, pad);
    for (b=0;b<r;b++) seg(pad+W, pad+b*cell, pad+W, pad+(b+1)*cell);
    for (a=c;a>0;a--) seg(pad+a*cell, pad+H, pad+(a-1)*cell, pad+H);
    for (b=r;b>0;b--) seg(pad, pad+b*cell, pad, pad+(b-1)*cell);
    stage.innerHTML=''; stage.append(svg);
    readA.innerHTML='<b>Area:</b> '+r+' row'+(r>1?'s':'')+' of '+c+' = '+r+' '+TIMES+' '+c+' = <b>'+(r*c)+' square units</b>';
    readP.innerHTML='<b>Perimeter:</b> '+c+' + '+r+' + '+c+' + '+r+' = <b>'+(2*(r+c))+' units</b>';
    if (mode==='count'){
      var k=0; readA.innerHTML='<b>Counting squares…</b>';
      var step=function(){ if (k>=cells.length){ stop(); readA.innerHTML='<b>Area:</b> '+(r*c)+' squares. That is '+r+' '+TIMES+' '+c+' = <b>'+(r*c)+' square units</b>'; return; }
        cells[k].rc.setAttribute('style','fill:var(--c0)'); cells[k].rc.setAttribute('stroke','currentColor'); cells[k].tx.textContent=String(k+1); k++; };
      if (reduceMotion){ while (k<cells.length) step(); step(); } else anim=setInterval(step, Math.max(40, Math.round(1600/cells.length)));
    }
    if (mode==='walk'){
      var q=0; readP.innerHTML='<b>Walking around…</b>';
      var step2=function(){ if (q>=segs.length){ stop(); readP.innerHTML='<b>Perimeter:</b> '+segs.length+' units all the way round. That is '+c+' + '+r+' + '+c+' + '+r+' = <b>'+(2*(r+c))+' units</b>'; return; }
        segs[q].setAttribute('stroke','var(--c6)'); q++; readP.innerHTML='<b>Walking around… '+q+'</b>'; };
      if (reduceMotion){ while (q<segs.length) step2(); step2(); } else anim=setInterval(step2, Math.max(60, Math.round(2000/segs.length)));
    }
  }
  var title = focus==='perim' ? 'Walk around the edge' : 'Count the squares inside';
  var hint = focus==='perim'
    ? 'Perimeter is the distance all the way around a shape. Each orange piece of edge is 1 unit long. Change the size, then walk around it.'
    : 'Area is how many unit squares cover a shape. Change the size, then count. Counting row by row is the same as rows × columns.';
  var btns = focus==='perim'
    ? [h('button',{class:'btn ap-p', onclick:function(){ draw('walk'); }},'Walk around the edge')]
    : [h('button',{class:'btn ap-a', onclick:function(){ draw('count'); }},'Count the squares')];
  root.append(h('section',{class:'panel'},
    h('h2',{},title), h('p',{class:'hint'},hint),
    h('div',{class:'two-col'},
      h('div',{},
        h('div',{class:'sliders'}, h('span',{},'Rows'), rs, rl, h('span',{},'Columns'), cs, cl),
        focus==='perim' ? readP : readA, focus==='perim' ? null : null,
        h('div',{class:'step-actions', style:'margin-top:14px'}, btns)),
      h('div',{class:'scroll-x'}, stage))));
  draw();
}

function apPanelPoly(root){

/* irregular polygons with labelled sides (not drawn to scale) */
var POLY_PTS={3:[[50,8],[94,88],[6,88]],4:[[10,14],[90,8],[96,86],[4,92]],5:[[50,4],[96,38],[80,94],[20,94],[4,38]],6:[[28,6],[72,6],[96,50],[72,94],[28,94],[4,50]]};
function polySVG(sides, unit, o){
  o=o||{};
  var P=POLY_PTS[sides.length], S=2.6, ox=40, oy=26, cx=50, cy=50;
  var pt=function(p){ return [ox+p[0]*S, oy+p[1]*S]; };
  var out='<svg class="apsvg" viewBox="0 0 '+(100*S+2*ox)+' '+(100*S+2*oy+18)+'" width="'+(100*S+2*ox)+'" height="'+(100*S+2*oy+18)+'" role="img" aria-label="A shape with sides '+sides.join(', ')+' '+unit+'">';
  out+='<polygon points="'+P.map(function(p){ return pt(p).join(' '); }).join(' ')+'" style="fill:var(--card)" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round"/>';
  for (var i=0;i<P.length;i++){
    var a=pt(P[i]), b=pt(P[(i+1)%P.length]);
    if (o.upto!=null && i<o.upto) out+='<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" stroke="var(--c6)" stroke-width="7" stroke-linecap="round"/>';
    var mx=(P[i][0]+P[(i+1)%P.length][0])/2, my=(P[i][1]+P[(i+1)%P.length][1])/2, dx=mx-cx, dy=my-cy, dl=Math.sqrt(dx*dx+dy*dy)||1;
    var lx=ox+(mx+dx/dl*12)*S, ly=oy+(my+dy/dl*12)*S+6;
    out+='<text x="'+lx+'" y="'+ly+'" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor">'+sides[i]+' '+unit+'</text>';
  }
  out+='<text x="'+(ox+50*S)+'" y="'+(100*S+2*oy+12)+'" text-anchor="middle" font-size="12" fill="currentColor" opacity=".7">not drawn to scale</text>';
  return out+'</svg>';
}

/* draw-your-own-shape pad (home page) */
function drawPad(){
  var R=6, C=10, on={}, cell=34, pad=6;
  var svgBox=h('div',{class:'padbox'}), read=h('p',{class:'padread'});
  function key(i,j){ return i+','+j; }
  function render(){
    var area=0, per=0, lines='';
    var svg='<svg class="apsvg pad" viewBox="0 0 '+(C*cell+2*pad)+' '+(R*cell+2*pad)+'" width="'+(C*cell+2*pad)+'" height="'+(R*cell+2*pad)+'" role="img" aria-label="Drawing grid">';
    for (var i=0;i<R;i++) for (var j=0;j<C;j++){
      var f=on[key(i,j)];
      svg+='<rect data-c="'+i+','+j+'" x="'+(pad+j*cell)+'" y="'+(pad+i*cell)+'" width="'+cell+'" height="'+cell+'" style="fill:'+(f?'var(--c0)':'var(--card)')+'" stroke="var(--line)" stroke-width="1.5"/>';
      if (f){ area++;
        var x=pad+j*cell, y=pad+i*cell;
        if (!on[key(i-1,j)]){ per++; lines+='M'+x+' '+y+'h'+cell; }
        if (!on[key(i+1,j)]){ per++; lines+='M'+x+' '+(y+cell)+'h'+cell; }
        if (!on[key(i,j-1)]){ per++; lines+='M'+x+' '+y+'v'+cell; }
        if (!on[key(i,j+1)]){ per++; lines+='M'+(x+cell)+' '+y+'v'+cell; }
      }
    }
    if (lines) svg+='<path d="'+lines+'" stroke="var(--c6)" stroke-width="5" stroke-linecap="round" pointer-events="none"/>';
    svgBox.innerHTML=svg+'</svg>';
    read.innerHTML = area ? '<span class="pa">Area <b>'+area+'</b> square units</span><span class="pp">Perimeter <b>'+per+'</b> units</span>' : 'Tap squares to colour a shape.';
  }
  svgBox.addEventListener('click', function(e){ var t=e.target.closest ? e.target.closest('[data-c]') : null; if (!t) return; var k=t.getAttribute('data-c'); if (on[k]) delete on[k]; else on[k]=1; render(); });
  render();
  return h('div',{class:'padwrap'}, h('div',{class:'scroll-x'}, svgBox), read,
    h('button',{class:'btn ghost', onclick:function(){ on={}; render(); }},'Clear'));
}

G.apPoly = function(){ var n=pick([3,4,5,6]), u=pick(AP_UNITS), s=[]; for (var i=0;i<n;i++) s.push(rnd(2,12)); var t=s.reduce(function(a,b){ return a+b; },0);
  return {type:'num', prompt:'Find the perimeter of this shape.', visual:polySVG(s,u), unit:u, answer:t,

G.apUnit = function(){ var u=pick(AP_UNITS), ar=Math.random()<.5, n=rnd(12,60);
  var thing = ar ? pick(['The area of a rug','The area of a garden','The area of a poster','The area of a classroom floor']) : pick(['The perimeter of a rug','The perimeter of a garden','The perimeter of a poster','The distance around a park']);
  return {type:'mc', prompt:thing+' is '+n+' ____. Which unit fits?', choices:[u,'square '+u], answer: ar ? 'square '+u : u,
    explain: ar ? 'Area is counted in squares, so it is square '+u+'.' : 'Perimeter is a length around the edge, so it is just '+u+'.'}; };
G.apCompare = function(){ var a,b,c2,d2,ask;
  do { a=rnd(2,9); b=rnd(2,9); c2=rnd(2,9); d2=rnd(2,9); ask=Math.random()<.5?'area':'perimeter';
  } while ((ask==='area' ? a*b===c2*d2 : a+b===c2+d2));
  var vA = ask==='area' ? a*b : 2*(a+b), vB = ask==='area' ? c2*d2 : 2*(c2+d2);
  return {type:'mc', prompt:'Rectangle A is <b>'+a+' cm by '+b+' cm</b>. Rectangle B is <b>'+c2+' cm by '+d2+' cm</b>. Which has the greater <b>'+ask+'</b>?', choices:['Rectangle A','Rectangle B'], answer: vA>vB ? 'Rectangle A' : 'Rectangle B',
    explain: ask==='area' ? 'A: '+a+' '+TIMES+' '+b+' = '+vA+'. B: '+c2+' '+TIMES+' '+d2+' = '+vB+'.' : 'A: '+a+' + '+b+' + '+a+' + '+b+' = '+vA+'. B: '+c2+' + '+d2+' + '+c2+' + '+d2+' = '+vB+'.'}; };
G.apSqSide = function(){ var u=pick(AP_UNITS), s=rnd(3,12), ar=Math.random()<.5;
  return {type:'num', prompt:'A square has '+(ar ? 'an area of <b>'+(s*s)+' square '+u+'</b>' : 'a perimeter of <b>'+(4*s)+' '+u+'</b>')+'. How long is each side?', unit:u, answer:s,
    explain: ar ? 'Which number times itself makes '+(s*s)+'? '+s+' '+TIMES+' '+s+' = '+(s*s)+', so each side = '+s+' '+u+'.' : 'A square has 4 equal sides: '+(4*s)+' '+DIVS+' 4 = '+s+' '+u+'.'}; };
G.apStory1 = function(){ var L=rnd(4,12), W=rnd(2,9), ar=Math.random()<.5;
  if (ar){ var th=pick([['A rug','covers'],['A garden bed','covers'],['A poster','covers']]);
    return {type:'num', prompt:th[0]+' is <b>'+L+' ft</b> long and <b>'+W+' ft</b> wide. How many square feet of floor or wall does it cover?', unit:'square ft', answer:L*W,
      explain:'Covering means area: '+L+' '+TIMES+' '+W+' = '+(L*W)+' square ft.'}; }
  var th2=pick([['field','fence'],['bulletin board','border'],['playground','fence']]);
  return {type:'num', prompt:'A '+th2[0]+' is <b>'+L+' m</b> long and <b>'+W+' m</b> wide. How many metres of '+th2[1]+' go all the way around it?', unit:'m', answer:2*(L+W),
    explain:'Going around means perimeter: '+L+' + '+W+' + '+L+' + '+W+' = '+(2*(L+W))+' m.'}; };

/* ================= MODULES (area & perimeter site) ================= */
var MODULES = [
  {id:'area', n:1, title:'What Is Area?', desc:'Count the squares inside', sym:'▦', color:'var(--c0)', learn:learnAPArea,
   gens:[G.apCount,G.apArea,G.apCount,G.apArea]},
  {id:'perim', n:2, title:'What Is Perimeter?', desc:'Walk all the way around', sym:'▢', color:'var(--c6)', learn:learnAPPerim,
   gens:[G.apPerim,G.apSquare,G.apPoly,G.apPerim]},
  {id:'which', n:3, title:'Area or Perimeter?', desc:'Inside or around? Pick the right one', sym:'?', color:'var(--c3)', learn:learnAPWhich,
   gens:[G.apChoose,G.apUnit,G.apChoose,G.apCompare]},
  {id:'same', n:4, title:'Same Area, New Shape', desc:'Equal area, different perimeters', sym:'=', color:'var(--c4)', learn:learnAPSame,
   gens:[G.apSame,G.apCompare,G.apSame]},
  {id:'miss', n:5, title:'Missing Sides', desc:'Work backwards to the unknown side', sym:'\u2194', color:'var(--c1)', symText:'#3A2A00', learn:learnAPMiss,
   gens:[G.apMissArea,G.apMissPerim,G.apSqSide]},
  {id:'lshape', n:6, title:'L-Shapes', desc:'Split into rectangles, then add', sym:'L', color:'var(--c5)', learn:learnAPL,
   gens:[G.apL,G.apLPerim]},
  {id:'story', n:7, title:'Story Problems', desc:'Plan, then solve in two steps', sym:'$', color:'var(--teal)', learn:learnAPStory,
   gens:[G.apWord,G.apStory1,G.apWord]},
  {id:'mixed', n:8, title:'Final Challenge', desc:'10 mixed questions from every stop', sym:'★', color:'var(--ink)', symText:'var(--paper)', learn:null, qcount:10}
];
function make(g){ var q=g(); q.key=g.key; return q; }
function quizFrom(gens, count){ var order=[]; while (order.length<count) order=order.concat(shuffle(gens)); return order.slice(0,count).map(make); }
Object.keys(G).forEach(function(k){ G[k].key=k; });
MODULES.forEach(function(m){
  m.makeQuiz = m.id==='mixed' ? function(count){
    var mods=MODULES.filter(function(x){ return x.id!=='mixed'; }), gens=mods.map(function(x){ return pick(x.gens); });
    while (gens.length<count) gens.push(pick(pick(mods).gens));
    return shuffle(gens).map(make);
  } : function(count){ return quizFrom(m.gens, count); };
});

/* ================= QUIZ ENGINE ================= */
function runQuiz(root, m){
  var count=m.qcount||5, qs, i, score, results;
  function start(){ qs=m.makeQuiz(count); i=0; score=0; results=[]; show(); }
  function show(){
    root.innerHTML='';
    var q=qs[i], done=false; root.__q=q;
    var dots=h('div',{class:'qdots','aria-hidden':'true'}, qs.map(function(_,k){ return h('span',{class: k<results.length ? (results[k]?'ok':'no') : (k===i?'cur':'')}); }));
    var fb=h('div',{class:'feedback', role:'status','aria-live':'polite'}), area=h('div');
    root.append(h('section',{class:'panel quiz'},
      h('div',{class:'qtop'}, h('span',{class:'progress'}, 'Question '+(i+1)+' of '+qs.length), dots),
      h('div',{class:'qprompt', html:q.prompt}), q.visual ? h('div',{class:'qvisual', html:q.visual}) : null, area, fb));
    function finish(ok, shown){
      if (done) return; done=true; results.push(ok); if (ok) score++;
      dots.children[i].className = ok ? 'ok' : 'no';
      fb.className='feedback '+(ok?'good':'bad');
      fb.innerHTML = (ok ? '<b>'+pick(['Yes! ','Nailed it! ','Correct! ','Great thinking! '])+'</b>' : '<b>Not quite.</b> The answer is <b>'+shown+'</b>. ')+(q.explain||'');
      var nx=h('button',{class:'btn go', onclick:function(){ i++; if (i<qs.length) show(); else end(); }}, i+1<qs.length ? 'Next question' : 'See my score');
      fb.append(h('div',{class:'fb-actions'}, nx)); nx.focus();
    }
    if (q.type==='mc'){
      var grid=h('div',{class:'choices'});
      q.choices.forEach(function(c){
        var b=h('button',{class:'btn choice', html:c, onclick:function(){
          if (done) return; var ok = c===q.answer;
          b.classList.add(ok?'right':'wrong');
          Array.prototype.forEach.call(grid.children, function(x){ if (x.__v===q.answer) x.classList.add('right'); x.disabled=true; });
          finish(ok, q.answer);
        }});
        b.__v=c; grid.append(b);
      });
      area.append(grid);
    } else if (q.type==='num'){
      var inp=h('input',{type:'text',inputmode:'numeric',autocomplete:'off',class:'ans','aria-label':'Your answer'});
      var btn=h('button',{class:'btn go'},'Check');
      var checkNum = function(){
        if (done) return; var v=parseNum(inp.value);
        if (v===''){ toast('Type your answer first.'); inp.focus(); return; }
        var ok = Number(v)===q.answer; inp.classList.add(ok?'right':'wrong'); inp.disabled=true; btn.disabled=true; finish(ok, fmt(q.answer));
      };
      btn.addEventListener('click', checkNum);
      inp.addEventListener('keydown', function(e){ if (e.key==='Enter') checkNum(); });
      area.append(h('div',{class:'answer-row'}, inp, q.unit ? h('span',{class:'unit'}, q.unit) : null, btn));
      setTimeout(function(){ inp.focus(); }, 40);
    } else if (q.type==='qr'){
      var iq=h('input',{type:'text',inputmode:'numeric',autocomplete:'off',class:'ans sm','aria-label':'Quotient'});
      var ir=h('input',{type:'text',inputmode:'numeric',autocomplete:'off',class:'ans sm','aria-label':'Remainder'});
      var btn2=h('button',{class:'btn go'},'Check');
      var checkQR = function(){
        if (done) return; var a=parseNum(iq.value), r=parseNum(ir.value)||'0';
        if (a===''){ toast('Type the quotient first.'); iq.focus(); return; }
        var ok = Number(a)===q.answer.q && Number(r)===q.answer.r;
        [iq,ir].forEach(function(x){ x.classList.add(ok?'right':'wrong'); x.disabled=true; }); btn2.disabled=true;
        finish(ok, q.answer.q+(q.answer.r ? ' r'+q.answer.r : ''));
      };
      btn2.addEventListener('click', checkQR);
      [iq,ir].forEach(function(x){ x.addEventListener('keydown', function(e){ if (e.key==='Enter') checkQR(); }); });
      area.append(h('div',{class:'answer-row'}, iq, h('span',{class:'pre'},'r'), ir, btn2));
      setTimeout(function(){ iq.focus(); }, 40);
    }
  }
  function end(){
    root.innerHTML='';
    var n=qs.length, st = n>=10 ? (score>=9?3:score>=7?2:score>=5?1:0) : (score===5?3:score===4?2:score===3?1:0);
    recordResult(m.id, score, n, st, qs, results);
    queueResult(me(), m, score, n, st, qs.filter(function(q,k){ return !results[k] && q.key; }).map(function(q){ return q.key; }));
    if (st>=2) confetti();
    var msg = st===3 ? 'Perfect work. You really understand this.' : st===2 ? 'Great job. One more round could get you 3 stars.' :
      st===1 ? 'Good start. Look at the Learn part again, then have another go.' : 'Let\u2019s go through the Learn part together, then try again.';
    root.append(h('section',{class:'panel result'},
      h('div',{class:'big-stars', html:starsHTML(st), role:'img', 'aria-label':st+' of 3 stars'}),
      h('h2',{}, 'You got '+score+' out of '+n), h('p',{}, msg),
      h('div',{class:'result-actions'},
        h('button',{class:'btn go', onclick:start},'Play again'),
        m.learn ? h('button',{class:'btn', onclick:function(){ go(m.id,'learn'); }},'Back to Learn') : null,
        h('button',{class:'btn', onclick:function(){ go('home'); }},'Back to the path'))));
  }
  start();
}

/* ================= VIEWS & ROUTING ================= */
function odometer(){
  var n=125347, box=h('div',{class:'panel odo-card'}), row=h('div',{class:'odo'}), say=h('p',{class:'odo-say'});
  function draw(){
    var d=digitsOf(n,6); row.innerHTML='';
    for (var p=5;p>=0;p--){
      (function(p){
        row.append(h('div',{class:'wheel', style:'--wc:var(--c'+p+')'},
          h('button',{class:'spin','aria-label':cap(PV[p].n)+' up', onclick:function(){ d[p]=(d[p]+1)%10; set(d); }},'\u25B2'),
          h('div',{class:'face'+(p===1?' dark':''),'aria-live':'polite'}, d[p]),
          h('button',{class:'spin','aria-label':cap(PV[p].n)+' down', onclick:function(){ d[p]=(d[p]+9)%10; set(d); }},'\u25BC'),
          h('small',{}, cap(PV[p].n))));
        if (p===3) row.append(h('span',{class:'comma','aria-hidden':'true'},','));
      })(p);
    }
    say.innerHTML = n===0 ? 'Spin a digit to start.' : '<b>'+fmt(n)+'</b> is <i>'+words(n)+'</i>';
  }
  function set(d){ n=d.reduce(function(s,x,p){ return s+x*Math.pow(10,p); },0); draw(); }
  draw(); box.append(row, say); return box;
}
function renderHome(){
  var grid=h('div',{class:'stations'});
  MODULES.forEach(function(m){
    grid.append(h('button',{class:'station', style:'--sc:'+m.color+(m.symText?';--st:'+m.symText:''), onclick:function(){ go(m.id, m.learn?'learn':'quiz'); }},

        h('span',{class:'st-desc'}, m.desc),

  });
  app.append(
    h('section',{class:'hero'},
